# ============================================================================
# dsh-persona-freedom —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 下面的 config 都能改；改完重启 DSH 生效。
#
# 它平时不注入字；只有「到点 + 今天没做 + 今天没提过 + 不在 DND」那一刻
# 才注一行，注之前先把它记进账（动完盘上多了字）。
# ============================================================================

- insert:
    - id: persona-freedom
      name: dsh-persona-freedom
      config:
        # 工作区根。留空 = 用进程当前目录（插件装在仓库里，往上推会推到 addons/）。
        workspace: ''

        # 账放哪，相对工作区。
        stateDir: '.persona-framework'

        # 到点之后要不要注那一行。关掉只剩记账，工具照样能用。
        remind: true
