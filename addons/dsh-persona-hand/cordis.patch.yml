# ============================================================================
# dsh-persona-hand —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 下面的 config 都能改；改完重启 DSH 生效。
#
# 它平时不注入字；只有「真动过、还没说出口」那一下才注一行，
# 注之前先把「说过了」写进盘（手账状态.json），这才算数。
# ============================================================================

- insert:
    - id: persona-hand
      name: dsh-persona-hand
      config:
        # 工作区根。留空 = 用会话头里的 cwd（插件装在仓库里，往上推会推到 addons/）。
        workspace: ''

        # 手账与状态放哪，相对工作区。
        stateDir: '.persona-framework'

        # 一条命令默认等多久，超时就杀掉，回执仍是真回执。
        timeoutMs: 60000

        # 动完还没说出口时，要不要注那一行。关掉只剩手账。
        speak: true
