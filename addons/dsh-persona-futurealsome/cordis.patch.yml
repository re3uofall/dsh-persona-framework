# ============================================================================
# dsh-persona-futurealsome —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 它是人格框架的附加插件：管的是「未来的我认不认今天这条」，
# 不碰注入顺序（段 order 18，只在有条目到期/升起时才有字）。
# ============================================================================

- insert:
    - id: persona-futurealsome
      name: dsh-persona-futurealsome
      config:
        # 工作区根。留空 = 从插件自己的位置往上推一级。
        workspace: ''
        # 未来账放在工作区的哪一层。
        dir: '.persona-framework'
        # 露出几条（按时空重叠度排序）。
        maxRising: 5
        # 至少要重叠几维才「升起」（时/地/人/情形）。
        minOverlap: 2
