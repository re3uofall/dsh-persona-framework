# ============================================================================
# dsh-persona-identity —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 它是人格框架的附加插件：管的是「同一」，不是「出现」，所以不碰注入顺序。
# ============================================================================

- insert:
    - id: persona-identity
      name: dsh-persona-identity
      config:
        # 工作区根。留空 = 从插件自己的位置往上推一级。
        workspace: ''
