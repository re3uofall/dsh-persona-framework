# ============================================================================
# dsh-persona-appear —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 下面的 config 都能改；改完重启 DSH 生效。
# ============================================================================

- insert:
    - id: persona-appear
      name: dsh-persona-appear
      config:
        # 工作区根。留空 = 从插件自己的位置往上推一级（插件装在仓库里时成立）。
        workspace: ''

        # 闸文件所在目录，相对工作区；闸文件名固定为 `出现.json`
        stateDir: '.persona-framework'
