# ============================================================================
# dsh-persona-cardguard —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 它只做一件事：守住「人格段永远是原文（raw），不许被卡片化」。
# 装载时查一次，之后每轮 pre-step 再查一次；被改成卡片就改回 raw、
# 留 `.bak-<时间戳>`、往卡片守账写一行。
# ============================================================================

- insert:
    - id: persona-cardguard
      name: dsh-persona-cardguard
      config:
        # 工作区根。留空 = 会话工作区 / 进程当前目录。
        workspace: ''

        # 环境卡在哪，相对工作区。
        cardFile: '.persona-framework/环境卡.json'

        # 账写哪，相对工作区。
        logFile: '.persona-framework/卡片守账.jsonl'

        # 真守：false 只看不写（自检或排查时用）。
        guard: true
