# ============================================================================
# dsh-persona-gradient —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 下面的 config 都能改；改完重启 DSH 生效。
#
# 它不注入任何一段话——器官不给字。要看数，调工具。
# ============================================================================

- insert:
    - id: persona-gradient
      name: dsh-persona-gradient
      config:
        # 工作区根。留空 = 从插件自己的位置往上推一级（插件装在仓库里时成立）。
        workspace: ''

        # 账和基线放哪，相对工作区。
        stateDir: '.persona-framework'

        # 量最近多少段她说的话。默认 12——一段大约一轮。
        sample: 12

        # 掉多少算「掉了」。这条是拍的，不是验出来的，报数里会写明。
        dropAt: 30
