# ============================================================================
# dsh-persona-energy —— 插件自己带的挂载声明
# ============================================================================
# 装上之后 profile 把本包列进 `dsh.profile.bundles` 即生效。
# 下面的 config 都能改；改完重启 DSH 生效。
#
# 它不注入任何一段话——只记账、只报数。接注入是下一步。
# ============================================================================

- insert:
    - id: persona-energy
      name: dsh-persona-energy
      config:
        # 工作区根。留空 = 从插件自己的位置往上推两级（插件装在仓库里时成立）。
        workspace: ''

        # 账放哪，相对工作区。
        stateDir: '.persona-framework'
